# A tag v<version> (the version of package.json and server.json) publishes @socialit/mcp to npm with
# provenance, the server to the MCP Registry (io.github.socialitcom/mcp) and a GitHub release. No
# secrets: npm trusts this workflow (trusted publishing, `npm trust github @socialit/mcp --file
# release.yml --repo socialitcom/mcp`) and the registry signs in with GitHub OIDC.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance and the MCP Registry's OIDC login
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: The tag, package.json and server.json agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          srv="$(node -p 'require("./server.json").version')"
          srv_pkg="$(node -p 'require("./server.json").packages[0].version')"
          echo "tag $tag, package.json $pkg, server.json $srv / $srv_pkg"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$srv" ] && [ "$tag" = "$srv_pkg" ]
          [ "$(node -p 'require("./package.json").mcpName')" = "$(node -p 'require("./server.json").name')" ]

      - run: npm ci
      - run: npm test

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.15.0

      - name: Publish to npm
        run: |
          if npm view "@socialit/mcp@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "@socialit/mcp@${GITHUB_REF_NAME#v} is already on npm"
          else
            npm publish --provenance --access public
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # npm can take a moment to answer for a version it has just accepted.
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "retrying in 20 s"; sleep 20
          done
          exit 1

      - name: GitHub release
        run: |
          notes="$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {p=1; next} /^## / && p {exit} p' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
